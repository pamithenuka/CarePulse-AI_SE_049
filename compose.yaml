services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: carepulse_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - carepulse_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carepulse_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  carepulse_postgres:
